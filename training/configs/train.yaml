# YOLOv8 Fine-tuning Hyperparameters — CarDD
# These are the defaults used by train.py
# You can override any value on the CLI: python scripts/train.py --epochs 100

# ── Model ─────────────────────────────────────────────────────────────────────
# Recommended starting point per hardware:
#   CPU          → yolov8n.pt
#   Mac M1/M2    → yolov8s.pt
#   Single GPU   → yolov8m.pt
#   Multi-GPU    → yolov8l.pt
model: yolov8s.pt

# ── Data ──────────────────────────────────────────────────────────────────────
data: data/processed/dataset.yaml
imgsz: 640

# ── Training ──────────────────────────────────────────────────────────────────
epochs: 50
batch: 8
patience: 20          # early stopping patience (epochs with no improvement)
save_period: 10       # save checkpoint every N epochs

# ── Optimiser ─────────────────────────────────────────────────────────────────
optimizer: AdamW
lr0: 0.001            # initial learning rate
lrf: 0.01             # final learning rate = lr0 * lrf
warmup_epochs: 3
weight_decay: 0.0005

# ── Augmentation ──────────────────────────────────────────────────────────────
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0
translate: 0.1
scale: 0.5
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.1
